<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELVR Valuation Suite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; margin: 0; background-color: #f8fafc; }
        input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
        .page-section { display: none; animation: fadeIn 0.3s ease-in-out; }
        .page-section.active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #f97316; }
        .dropdown:hover .dropdown-menu { display: block; }
    </style>
</head>
<body class="min-h-screen flex flex-col text-slate-800">

    <nav class="bg-[#0f172a] text-white shadow-lg sticky top-0 z-50 border-b border-orange-500/30">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex items-center justify-between h-14">
                <div class="flex items-center gap-3 cursor-pointer" onclick="switchPage('home')">
                    <div class="w-7 h-7 bg-orange-600 rounded flex items-center justify-center font-bold text-white text-sm">E</div>
                    <span class="font-bold text-lg text-slate-100">ELVR Suite</span>
                </div>
                <div class="flex space-x-2">
                    <button onclick="switchPage('home')" id="btn-home" class="px-3 py-1.5 rounded-md text-xs font-medium bg-orange-600 text-white">Home</button>
                    <button onclick="switchPage('assets')" id="btn-assets" class="px-3 py-1.5 rounded-md text-xs text-slate-400">Assets</button>
                    <div class="relative dropdown">
                        <button class="px-3 py-1.5 rounded-md text-xs text-slate-400 flex items-center gap-1">Calculators <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg></button>
                        <div class="dropdown-menu absolute right-0 w-48 bg-white rounded-md shadow-lg py-1 hidden border border-slate-200 z-50">
                            <a href="#" onclick="switchPage('share-price'); return false;" class="block px-4 py-2 text-sm text-slate-700 hover:bg-slate-100">Share Price Estimator</a>
                            <a href="#" onclick="switchPage('ore-calc'); return false;" class="block px-4 py-2 text-sm text-slate-700 hover:bg-slate-100">Ore Calculator</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div id="page-share-price" class="page-section active flex-grow p-4">
        <div class="flex flex-grow bg-white rounded-xl shadow-xl border border-slate-200 overflow-hidden w-full h-[calc(100vh-6rem)]">
            
            <div class="w-1/5 bg-[#0f172a] p-3 flex flex-col space-y-2 text-white shadow-lg overflow-y-auto border-r border-slate-800">
                <div class="pb-1 border-b border-slate-700"><h3 class="text-sm font-bold text-orange-500">Estimator Inputs</h3></div>
                
                <div class="flex flex-col"><label class="text-[10px] text-slate-400"># Shares</label><input type="number" id="numShares" class="py-1 px-2 bg-slate-800 border border-slate-600 rounded text-white text-xs" value="1"></div>
                <div class="flex flex-col"><label class="text-[10px] text-slate-400">SOI</label><input type="text" id="sharesOnIssue" class="py-1 px-2 bg-slate-800 border border-slate-600 rounded text-white text-xs" value="168,241,667"></div>
                <div class="flex flex-col"><label class="text-[10px] text-slate-400">Spodumene Price ($)</label><input type="number" id="spodumenePrice" class="py-1 px-2 bg-slate-800 border border-slate-600 rounded text-white text-xs" value="1000"></div>
                
                <div class="flex flex-col"><label class="text-[10px] text-slate-400">% Grade</label><input type="number" id="productGrade" class="py-1 px-2 bg-slate-800 border border-slate-600 rounded text-white text-xs" value="6.0" step="0.1"></div>
                
                <div class="flex flex-col"><label class="text-[10px] text-slate-400">Exch Rate</label><input type="number" id="exchangeRate" class="py-1 px-2 bg-slate-800 border border-slate-600 rounded text-white text-xs" value="0.65"></div>

                <div class="pt-1 pb-1 border-b border-slate-700"><h3 class="text-[10px] font-bold text-orange-500 uppercase">Costs</h3></div>
                <div class="grid grid-cols-2 gap-2">
                    <div class="flex flex-col"><label class="text-[9px] text-slate-400">NAL</label><input type="number" id="nalCosts" class="py-0.5 px-1 bg-slate-800 border border-slate-600 rounded text-white text-[10px]" value="750"></div>
                    <div class="flex flex-col"><label class="text-[9px] text-slate-400">Moblan</label><input type="number" id="moblanCosts" class="py-0.5 px-1 bg-slate-800 border border-slate-600 rounded text-white text-[10px]" value="550"></div>
                    <div class="flex flex-col"><label class="text-[9px] text-slate-400">Ewoyaa</label><input type="number" id="ewoyaaCosts" class="py-0.5 px-1 bg-slate-800 border border-slate-600 rounded text-white text-[10px]" value="600"></div>
                    <div class="flex flex-col"><label class="text-[9px] text-slate-400">CLM</label><input type="number" id="clmCosts" class="py-0.5 px-1 bg-slate-800 border border-slate-600 rounded text-white text-[10px]" value="500"></div>
                </div>

                <div class="pt-1 pb-1 border-b border-slate-700"><h3 class="text-[10px] font-bold text-orange-500 uppercase">Production</h3></div>
                <div class="grid grid-cols-2 gap-2">
                    <div class="flex flex-col"><label class="text-[9px] text-slate-400">NAL</label><input type="text" id="nalProduction" class="py-0.5 px-1 bg-slate-800 border border-slate-600 rounded text-white text-[10px]" value="210,000"></div>
                    <div class="flex flex-col"><label class="text-[9px] text-slate-400">Moblan</label><input type="text" id="moblanProduction" class="py-0.5 px-1 bg-slate-800 border border-slate-600 rounded text-white text-[10px]" value="600,000"></div>
                    <div class="flex flex-col"><label class="text-[9px] text-slate-400">Ewoyaa</label><input type="text" id="ewoyaaProduction" class="py-0.5 px-1 bg-slate-800 border border-slate-600 rounded text-white text-[10px]" value="300,000"></div>
                    <div class="flex flex-col"><label class="text-[9px] text-slate-400">CLM</label><input type="text" id="clmProduction" class="py-0.5 px-1 bg-slate-800 border border-slate-600 rounded text-white text-[10px]" value="250,000"></div>
                </div>
                <button id="calculateButton" class="mt-2 px-4 py-2 bg-orange-600 text-white font-bold rounded text-xs">Calculate</button>
            </div>

            <div class="w-4/5 p-4 bg-slate-50 h-full overflow-hidden">
                <div class="bg-white p-4 border border-slate-200 rounded-xl h-full flex flex-col overflow-hidden">
                    <h2 class="text-sm font-bold text-slate-800 border-b pb-2 mb-2">Detailed Forecast Table</h2>
                    <div class="flex-grow overflow-auto">
                        <table class="min-w-full text-xs">
                            <thead class="bg-slate-100 text-slate-600 uppercase text-[10px] font-bold sticky top-0">
                                <tr>
                                    <th class="py-2 px-3 text-left">Times Revenue</th>
                                    <th class="py-2 px-3 text-left">Market Cap</th>
                                    <th class="py-2 px-3 text-left text-orange-600">Share Price USD</th>
                                    <th class="py-2 px-3 text-left">My Total US$</th>
                                    <th class="py-2 px-3 text-left">IN AUD</th>
                                    <th class="py-2 px-3 text-left">My Total AUD</th>
                                </tr>
                            </thead>
                            <tbody id="outputTableBody" class="divide-y divide-slate-100"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function switchPage(pageId) {
            $('.page-section').removeClass('active'); $('#page-' + pageId).addClass('active');
            $('nav button').removeClass('bg-orange-600 text-white').addClass('text-slate-400');
            $('#btn-' + pageId).addClass('bg-orange-600 text-white').removeClass('text-slate-400');
        }

        $(document).ready(function() {
            function parseNum(str) { return parseFloat(String(str).replace(/,/g, '')) || 0; }

            function updateOutputs() {
                const numShares = parseFloat($('#numShares').val()) || 0;
                const SOI = parseNum($('#sharesOnIssue').val());
                const spodPrice = parseFloat($('#spodumenePrice').val()) || 0;
                const grade = parseFloat($('#productGrade').val()) || 6.0;
                const exch = parseFloat($('#exchangeRate').val()) || 0;

                // GRADE FIX: Benchmark adjusted by user grade
                const adjPrice = spodPrice * (grade / 6.0);

                const costs = { nal: parseFloat($('#nalCosts').val())||0, mob: parseFloat($('#moblanCosts').val())||0, ewo: parseFloat($('#ewoyaaCosts').val())||0, clm: parseFloat($('#clmCosts').val())||0 };
                const prod = { nal: parseNum($('#nalProduction').val()), mob: parseNum($('#moblanProduction').val()), ewo: parseNum($('#ewoyaaProduction').val()), clm: parseNum($('#clmProduction').val()) };

                const profit = (prod.nal*(adjPrice-costs.nal)) + (prod.mob*0.60*(adjPrice-costs.mob)) + (prod.ewo*0.50*(adjPrice-costs.ewo)) + (prod.clm*(adjPrice-costs.clm));

                let rows = '';
                [7, 8, 10, 15, 20, 25, 30].forEach(m => {
                    const cap = profit * m;
                    const usdPrice = SOI > 0 ? cap / SOI : 0;
                    const myUSD = usdPrice * numShares;

                    // AUD FIX: Converting to AUD then DIVIDING BY 10
                    const audPrice = exch > 0 ? (usdPrice / exch) / 10 : 0;
                    const myAUD = exch > 0 ? (myUSD / exch) / 10 : 0;

                    rows += `<tr class="hover:bg-orange-50/50">
                        <td class="py-2 px-3 font-medium">${m}x</td>
                        <td class="py-2 px-3">$${cap.toLocaleString(undefined, { maximumFractionDigits: 0 })}</td>
                        <td class="py-2 px-3 font-bold text-orange-600">$${usdPrice.toLocaleString(undefined, { minimumFractionDigits: 3, maximumFractionDigits: 3 })}</td>
                        <td class="py-2 px-3">$${myUSD.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</td>
                        <td class="py-2 px-3">$${audPrice.toLocaleString(undefined, { minimumFractionDigits: 3, maximumFractionDigits: 3 })}</td>
                        <td class="py-2 px-3 font-bold">$${myAUD.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</td>
                    </tr>`;
                });
                $('#outputTableBody').html(rows);
            }

            $('#calculateButton').on('click', updateOutputs);
            $('input').on('input', updateOutputs);
            updateOutputs();
        });
    </script>
</body>
</html>
